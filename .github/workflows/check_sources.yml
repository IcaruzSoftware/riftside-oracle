name: Check Data Sources

# Manual-only: verify Oracle's Elixir and the lolesports API are reachable from a runner.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Oracle's Elixir
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}   # optional; empty = public link
        run: python src/pipeline/oe.py --check

      - name: Check lolesports API
        if: success() || failure()
        run: python src/pipeline/lolesports.py --check
