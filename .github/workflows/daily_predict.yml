name: Daily Predictions

on:
  # Runs after Daily Evaluate finishes with any conclusion — a failed evaluate (e.g.
  # Drive blocked the OE download) still predicts, on the previous committed state.
  workflow_run:
    workflows: ["Daily Evaluate"]
    types: [completed]
  schedule:
    - cron: "0 3 * * *"    # safety net for early-UTC matches if evaluate runs late (uses yesterday's state)
    - cron: "0 15 * * *"   # picks up bracket matches whose TBD teams resolved during the day
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # workflow_run otherwise may check out the SHA from before evaluate's
          # state commit.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the lolesports schedule + predict the next 36h
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/scripts/daily_run.py --predict
