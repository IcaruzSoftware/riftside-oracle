name: Daily Evaluate

on:
  schedule:
    - cron: "45 7 * * *"   # 07:45 UTC, after Oracle's Elixir's ~07:05 UTC refresh — GitHub often starts scheduled runs late, which is fine here
  workflow_dispatch:

permissions:
  contents: write           # needed to commit the refreshed state files

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exits non-zero if evaluate or the state update failed (e.g. Drive's OE quota
      # block), so the run shows as failed; both are always attempted.
      - name: Evaluate results + update state (OE download, incremental ELO)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/scripts/daily_run.py --evaluate

      # Also after a failed step above: if only evaluate failed, the state update
      # still succeeded and must be committed.
      - name: Commit updated state files if changed
        if: success() || failure()
        run: |
          git config user.name  "riftside-oracle[bot]"
          git config user.email "bot@riftside-oracle"
          # `git add src/data/` stages only the committed state files — .gitignore
          # ignores everything else under data/ (see .gitignore negations).
          git add src/data/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: daily state update [skip ci]"
            # Rebase onto any concurrent push so this push can't fail non-fast-forward.
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
          fi
