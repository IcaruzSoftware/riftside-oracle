name: Daily Evaluate

on:
  schedule:
    - cron: "0 7 * * *"   # 3:00 AM ET (2:00 AM in winter/EST), 07:00 UTC, after West Coast games are final — GitHub often starts scheduled runs hours late, which is fine here
  workflow_dispatch:

permissions:
  contents: write           # needed to commit the refreshed state files

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate results + update state (CDN box scores, incremental ELO)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NBA_PROXIES:  ${{ secrets.NBA_PROXIES }}
        run: python src/scripts/daily_run.py --evaluate

      - name: Commit updated state files if changed
        run: |
          git config user.name  "courtside-oracle[bot]"
          git config user.email "bot@courtside-oracle"
          # `git add src/data/` stages only the committed state files — .gitignore
          # ignores everything else under data/ (see .gitignore negations).
          git add src/data/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: daily state update [skip ci]"
            # Rebase onto any concurrent push so this push can't fail non-fast-forward.
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
          fi
